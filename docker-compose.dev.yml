# 本地開發 override —— 配合 docker-compose.yml 使用
#
# 用途:本機同時 clone 了 finance-scraper-service / stt-ai-worker 在 sibling 路徑時,
# 想 hot-edit 各 repo 的 config / 程式,免去每次都 rebuild image。
#
# 使用:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# 純 image 部署 (production / try-it-out) 不要套這份,只跑 docker-compose.yml 即可。
services:
  finance-scraper-service:
    volumes:
      # mount sibling repo 的 config 覆寫 image 內建 yaml,改設定不用 rebuild
      - ../finance-scraper-service/config:/app/config:ro

  stt-ai-worker:
    volumes:
      # mount sibling repo 的 app/ 進去,改 Python 即時生效 (搭配下面 --reload)
      - ../stt-ai-worker/app:/app/app
    # 覆寫 image CMD,開 uvicorn --reload watch /app/app
    command: ["uvicorn", "app.asgi:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
