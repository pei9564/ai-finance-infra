services:
  # 1. 中央大腦：Redis (負責任務排隊)
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # host 6380 → 容器 6379 (避開其他專案佔的 6379)
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. 資料金庫：PostgreSQL (負責存文字與狀態)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"  # host 5433 → 容器 5432 (避開其他本機專案佔的 5432)
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==========================================
  # 以下是你自己寫的兩個服務
  # ==========================================

  # 3. 爬蟲服務 (Repo 1)
  finance-scraper-service:
    image: ${SCRAPER_IMAGE}
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"  # 讓 watchtower 自動更新這個 container
    ports:
      - "${SCRAPER_PORT:-8080}:8080"  # finance-scraper-service 容器內監聽 8080
    environment:
      # --- infra 層級連線設定 (動態組裝) ---
      # finance-scraper-service 程式讀的是 PG_DSN (不是 DB_URL),要用 docker 服務名 postgres
      - PG_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0  # 目前 finance-scraper-service 沒讀,保留給未來
      # 容器內無法用 localhost 連到 host 上的 vLLM gateway,用 host.docker.internal
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://host.docker.internal:8000/v1}
      # STT 走同 compose network 的 service name,不要打 host 的 localhost
      - STT_BASE_URL=${STT_BASE_URL:-http://stt-ai-worker:8000}
      # --- application 設定 (從 .env 讀,空值留 fallback) ---
      - GITHUB_TOKEN=${GITHUB_TOKEN:?GITHUB_TOKEN required in .env}
      - VLLM_MODEL=${VLLM_MODEL:-}
      - VLLM_API_KEY=${VLLM_API_KEY:-}
      - LOOKBACK_DAYS=${LOOKBACK_DAYS:-7}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux 上讓容器能用 host.docker.internal 連回 host
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # 4. STT 運算服務 (Repo 2)
  stt-ai-worker:
    image: ${STT_IMAGE}
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"  # 讓 watchtower 自動更新這個 container
    ports:
      - "8001:8000"  # 前端走 host 8001 → 容器 8000 (避開 finance-scraper-service 佔的 8000)
    environment:
      # --- infra 層級連線設定 (動態組裝) ---
      - REDIS_URL=redis://redis:6379/0
      - DB_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # --- application 設定 (從 .env 讀,給合理 default) ---
      - MODEL=${STT_MODEL:-medium}                    # tiny / base / small / medium / large-v3
      - DEVICE=${STT_DEVICE:-cuda}                    # cuda (GPU) / cpu
      - COMPUTE_TYPE=${STT_COMPUTE_TYPE:-int8}        # int8 / float16 (GPU 用 int8 省 VRAM)
      - BATCH_SIZE=${STT_BATCH_SIZE:-4}               # 1 不批次最省電 / 4 平衡 / 8 最快
      - LANGUAGE=${STT_LANGUAGE:-zh}                  # 留空=自動偵測; zh / en
    volumes:
      # HF_CACHE_DIR: host 上的 HuggingFace model cache,容器內 mount 到 /root/.cache/huggingface
      # 避免每次重啟都重新下載幾 GB 的模型權重
      - ${HF_CACHE_DIR:-./hf_cache}:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # GPU 模式 (STT_DEVICE=cuda 時需要 NVIDIA Container Toolkit)
    # 改純 CPU 時把 .env 的 STT_DEVICE 改成 cpu,並把下面 deploy 整段註解掉
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # 5. 自動更新:每 30 秒問 GHCR 一次,有新 image 就 pull + 重啟有貼 label 的 container
  # 只更新貼了 com.centurylinklabs.watchtower.enable=true 的 service (scraper + stt)
  # DB / Redis 不會被動到。pin 版本 (改 :sha-xxx 或 :v1.2.3) 後也不會被升 — 因為 tag 不會變
  watchtower:
    # 用 nickfedor 的活躍 fork (containrrr/watchtower 維護停滯,Docker API client 太舊)
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    environment:
      - WATCHTOWER_POLL_INTERVAL=30
      - WATCHTOWER_LABEL_ENABLE=true       # 只動有貼 enable label 的 container
      - WATCHTOWER_CLEANUP=true             # 升完刪掉舊 image,不會塞滿硬碟
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - TZ=Asia/Taipei
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 共用 host 的 docker login credential,才能拉 private GHCR image
      # DOCKER_CONFIG_PATH 預設 ~/.docker/config.json,要先在 host 上 docker login ghcr.io
      - ${DOCKER_CONFIG_PATH:-~/.docker/config.json}:/config.json:ro

volumes:
  pg_data:
