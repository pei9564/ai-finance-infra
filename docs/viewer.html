<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading… · ai-finance-infra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Schibsted+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .viewer-back {
    font-family: var(--codeFont);
    font-size: 0.82rem;
    color: var(--gray);
    margin: 0 0 2rem;
  }
  .viewer-back a { color: var(--gray); border-bottom-color: color-mix(in srgb, var(--gray) 35%, transparent); }
  .viewer-back a:hover { color: var(--secondary); border-bottom-color: var(--secondary); }
  #content blockquote {
    border-left: 3px solid var(--secondary);
    background: var(--highlight);
    margin: 1.4rem 0;
    padding: 0.6rem 1rem;
    color: var(--darkgray);
    border-radius: 0 var(--pf-radius) var(--pf-radius) 0;
  }
  #content blockquote p { margin: 0.4rem 0; }
  #content ul, #content ol { padding-left: 1.4rem; }
  #content li { margin: 0.25rem 0; }
  #content h1 { margin-top: 0.5rem; }
  #content hr { margin: 2rem 0; }
  .viewer-error { color: var(--gray); font-family: var(--codeFont); }
</style>
</head>
<body>

<main class="center">
  <p class="viewer-back"><a href="./">← 回到主頁</a></p>
  <article id="content">Loading…</article>
</main>

<script type="module">
  import { marked } from 'https://cdn.jsdelivr.net/npm/marked@12/lib/marked.esm.js';

  const params = new URLSearchParams(location.search);
  const file = params.get('file');
  const content = document.getElementById('content');

  function fail(msg) {
    content.innerHTML = `<h1>讀取失敗</h1><p class="viewer-error">${msg}</p>`;
  }

  if (!file) {
    fail('缺少 ?file= 參數');
  } else if (!/^[\w\-./]+\.md$/.test(file) || file.includes('..')) {
    fail('路徑格式不允許');
  } else {
    fetch(file)
      .then(r => r.ok ? r.text() : Promise.reject('HTTP ' + r.status))
      .then(md => {
        const stripped = md.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n/, '');
        content.innerHTML = marked.parse(stripped);
        const h1 = content.querySelector('h1');
        document.title = (h1?.textContent.trim() || file) + ' · ai-finance-infra';
      })
      .catch(err => fail(`${file} — ${err}`));
  }
</script>

</body>
</html>
