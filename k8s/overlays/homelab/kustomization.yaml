apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# Desired app revisions; publish these commits to GHCR before deploying.
images:
  - name: ghcr.io/pei9564/finance-scraper-service
    newTag: sha-036e8ec
  - name: ghcr.io/pei9564/stt-ai-worker
    newTag: sha-c3ba002
configMapGenerator:
  - name: stt-config
    behavior: merge
    literals:
      - DEVICE=cuda
patches:
  - path: placement.yaml
  - path: gpu.yaml
