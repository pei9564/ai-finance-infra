apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# Replace latest with a published sha-<short SHA> tag before deployment.
images:
  - name: ghcr.io/pei9564/finance-scraper-service
    newTag: latest
  - name: ghcr.io/pei9564/stt-ai-worker
    newTag: latest
configMapGenerator:
  - name: stt-config
    behavior: merge
    literals:
      - DEVICE=cuda
patches:
  - path: placement.yaml
  - path: gpu.yaml
