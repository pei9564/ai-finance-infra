apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: finance
resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - scraper.yaml
  - stt.yaml
# Hash suffixes update Deployment references when configuration changes.
configMapGenerator:
  - name: scraper-config
    literals:
      - VLLM_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai
      - VLLM_MODEL=gemini-2.5-flash
      - STT_BASE_URL=http://stt-ai-worker:8000
      - LOOKBACK_DAYS=7
      - LLM_TIMEOUT_SECONDS=120
      - STT_TIMEOUT_SECONDS=7200
      - MAX_STT_SUBMISSIONS=20
  - name: stt-config
    literals:
      - MODEL=medium
      - DEVICE=cpu
      - COMPUTE_TYPE=int8
      - BATCH_SIZE=4
      - LANGUAGE=zh
      - MAX_UPLOAD_BYTES=536870912
      - MAX_DOWNLOAD_BYTES=536870912
      - MAX_AUDIO_SECONDS=7200
      - MAX_PENDING_JOBS=20
      - MAX_FEED_EPISODES=20
      - MAX_BATCH_SIZE=16
      - MAX_JOB_SECONDS=7200
      - DOWNLOAD_TIMEOUT_SECONDS=600
      - MIN_FREE_DISK_BYTES=536870912
