apiVersion: v1
kind: Service
metadata:
  name: stt-ai-worker
  namespace: finance
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
spec:
  ports:
    - port: 8000
  selector:
    app: stt

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt-ai-worker
  namespace: finance
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stt
  template:
    metadata:
      labels:
        app: stt
    spec:
      imagePullSecrets:
        - name: ghcr-cred
      containers:
        - name: stt
          image: ghcr.io/pei9564/stt-ai-worker:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: stt-config
          env:
            - name: ALERT_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ALERT_WEBHOOK_URL
                  optional: true
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_DB
            - name: DB_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
            - name: hf-cache
              mountPath: /root/.cache/huggingface
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 10
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: stt-uploads
        - name: hf-cache
          hostPath:
            path: /opt/hf-cache           # Host 上的固定路徑，避免重下載模型
            type: DirectoryOrCreate

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stt-uploads
  namespace: finance
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
